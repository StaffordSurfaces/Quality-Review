<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#9DC3E6">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Site Measurement Sheet</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@700&display=swap">
<style>
/* ===== SETUP: paste your Web3Forms access key in the script near the bottom (ACCESS_KEY) ===== */
:root{
  --bg:#EEF2F4; --surface:#FFFFFF; --ink:#2C3539; --muted:#5E6B71; --line:#D3DCE1;
  --brand:#0084B5; --band:#9DC3E6; --accent:#A13D3D; --field:#FFF8DB; --fieldline:#E7D99A;
  --good:#2E7D4F; --warn:#B26A00; --onbrand:#FFFFFF;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#141A1D; --surface:#1E2629; --ink:#E6ECEE; --muted:#9AA8AE; --line:#33403F;
  --brand:#3BAEDB; --band:#2A4A63; --accent:#E07A7A; --field:#2A2716; --fieldline:#5A5226;
  --good:#5CC48A; --warn:#E8A54B; --onbrand:#0E1416; color-scheme:dark}}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
header{background:var(--band);padding:14px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px))}
.hd{max-width:600px;margin:0 auto}
.hd img{height:34px;width:auto;display:block;margin-bottom:6px}
.brand{font-family:var(--display);font-size:13px;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
h1{font-family:var(--display);font-weight:700;font-size:28px;margin:0;line-height:1.05}
main{max-width:600px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
section{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
h2{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.04em;text-transform:uppercase;margin:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.full{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:4px;min-width:0}
.lbl{font-size:13px;font-weight:600;color:var(--muted)}
input,textarea{font:500 17px var(--body);color:var(--ink);background:var(--field);border:1px solid var(--fieldline);border-radius:8px;padding:11px 10px;width:100%;min-height:48px;min-width:0}
textarea{min-height:100px;resize:vertical}
input:focus,textarea:focus,button:focus-visible{outline:3px solid var(--brand);outline-offset:1px}
.check{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.check span{font-weight:600}
.yn{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.yn button{border:0;background:var(--surface);color:var(--ink);font:600 15px var(--body);width:64px;min-height:44px;cursor:pointer}
.yn button+button{border-left:1px solid var(--line)}
.yn button[aria-pressed="true"][data-v="Yes"]{background:var(--good);color:var(--onbrand)}
.yn button[aria-pressed="true"][data-v="No"]{background:var(--accent);color:var(--onbrand)}
.room{display:grid;grid-template-columns:1fr 1fr;gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg)}
.room .top{grid-column:1/-1;display:flex;gap:8px;align-items:end}
.room .top label{flex:1}
.x{border:1px solid var(--line);background:var(--surface);color:var(--accent);font:600 20px var(--body);width:48px;height:48px;border-radius:8px;cursor:pointer;flex:none}
.x.arm{background:var(--accent);color:var(--onbrand);font-size:12px}
.area{grid-column:1/-1;font-variant-numeric:tabular-nums;font-weight:700;color:var(--brand);font-size:15px;min-height:20px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 16px var(--body);min-height:48px;padding:0 16px;border-radius:10px;cursor:pointer}
.btn.add{border-style:dashed;color:var(--brand);width:100%}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--onbrand)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:13px;color:var(--muted)}
.msg{font-size:14px;padding:10px 12px;border-radius:8px;background:var(--bg)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding:10px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.barin{max-width:600px;margin:0 auto;display:flex;gap:10px;align-items:center}
.sum{flex:1;min-width:0;font-variant-numeric:tabular-nums}
.sum .a{font-family:var(--display);font-size:24px;font-weight:700;line-height:1}
.sum .b{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum .b.off{color:var(--warn);font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;z-index:6;max-width:90vw}
@media (max-width:360px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<header><div class="hd">
  <img src="logo.png" alt="Stafford Surfaces" onerror="this.hidden=true;document.getElementById('brandTxt').hidden=false">
  <div class="brand" id="brandTxt" hidden>Stafford Surfaces</div>
  <h1>Site Measurement Sheet</h1>
</div></header>

<main>
  <section>
    <h2>Job</h2>
    <div class="grid">
      <label class="full"><span class="lbl">Customer</span><input id="customer" data-k="customer" autocomplete="off"></label>
      <label class="full"><span class="lbl">Property / address</span><input id="property" data-k="property" autocomplete="off"></label>
      <label><span class="lbl">Visit date</span><input id="visitDate" data-k="visitDate" type="date"></label>
      <label><span class="lbl">Measured by</span><input id="measuredBy" data-k="measuredBy"></label>
      <label class="full"><span class="lbl">Quoted estimate (sq ft), if known</span><input id="estimate" data-k="estimate" inputmode="decimal"></label>
    </div>
  </section>

  <section>
    <h2>Site checks</h2>
    <div id="checks"></div>
    <div class="grid">
      <label><span class="lbl">Existing floor</span><input id="existingFloor" data-k="existingFloor" list="floors"></label>
      <label><span class="lbl">Subfloor</span><input id="subfloor" data-k="subfloor" list="subfloors"></label>
    </div>
  </section>

  <section>
    <h2>Rooms</h2>
    <div class="hint">Feet, or feet and inches like 12'6.</div>
    <div id="rooms" style="display:flex;flex-direction:column;gap:10px"></div>
    <button class="btn add" type="button" id="addRoom">+ Add room</button>
  </section>

  <section>
    <h2>Notes</h2>
    <label><span class="hint">Transitions, stairs, base, moisture, access, furniture, anything that affects the price or install.</span><textarea id="notes" data-k="notes" rows="5"></textarea></label>
  </section>

  <section>
    <div class="row2">
      <button class="btn" type="button" id="copyBtn">Copy summary</button>
      <button class="btn" type="button" id="newBtn">New visit</button>
    </div>
    <div class="hint" id="saveState">Send emails this sheet to the office. With no signal it waits on this phone and sends later. Text photos to the office separately.</div>
    <div class="msg" id="outbox" hidden></div>
    <textarea id="copyFallback" hidden readonly rows="8"></textarea>
  </section>
</main>

<div class="bar"><div class="barin">
  <div class="sum"><div class="a"><span id="total">0</span> sq ft</div><div class="b" id="sub">Add rooms below</div></div>
  <button class="btn primary" type="button" id="sendBtn">Send to office</button>
</div></div>
<div class="toast" id="toast" hidden></div>

<datalist id="floors"><option>Carpet</option><option>Carpet tile</option><option>LVT / vinyl plank</option><option>Sheet vinyl</option><option>VCT</option><option>Ceramic / porcelain tile</option><option>Hardwood</option><option>Laminate</option><option>Concrete</option><option>None</option></datalist>
<datalist id="subfloors"><option>Concrete slab</option><option>Plywood</option><option>OSB</option><option>Existing tile</option><option>Raised access floor</option></datalist>

<script>
(function(){
// ===== SETUP: paste the Web3Forms access key here (the same one as the quality feedback form) =====
const ACCESS_KEY="PASTE-YOUR-WEB3FORMS-ACCESS-KEY";

const CHECKS=[["access","Access OK"],["occupied","Occupied"],["furniture","Furniture to move"],["moisture","Moisture concern"],["level","Level / damage concern"],["followUp","Follow-up needed"]];
const DRAFT="ssMeasureDraft.v2", OUTBOX="ssMeasureOutbox.v1";
const $=id=>document.getElementById(id);
const today=()=>new Date().toISOString().slice(0,10);
const blank=()=>({visitDate:today(),rooms:[{name:"",len:"",wid:""}]});
let S=blank();
try{const d=localStorage.getItem(DRAFT);if(d)S=Object.assign(blank(),JSON.parse(d))}catch(e){}
const save=()=>{try{localStorage.setItem(DRAFT,JSON.stringify(S))}catch(e){}};

// 12.5 · 12'6 · 12' 6" · 12-6
function ft(v){v=String(v||"").trim();if(!v)return NaN;
  const m=v.match(/^(\d+(?:\.\d+)?)\s*(?:'|ft|’)\s*(?:(\d+(?:\.\d+)?)\s*(?:"|in|”)?)?$/i)||v.match(/^(\d+(?:\.\d+)?)\s*-\s*(\d+(?:\.\d+)?)$/);
  if(m)return +m[1]+(m[2]?+m[2]/12:0);const n=Number(v);return isFinite(n)?n:NaN}
const area=r=>{const L=ft(r.len),W=ft(r.wid);return isFinite(L)&&isFinite(W)?L*W:NaN};
const f=n=>isFinite(n)?(Math.round(n*10)/10).toLocaleString(undefined,{maximumFractionDigits:1}):"–";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function totals(){let a=0,p=0,n=0;S.rooms.forEach(r=>{const x=area(r);if(isFinite(x)){a+=x;p+=2*(ft(r.len)+ft(r.wid));n++}});return{a,p,n}}

$("checks").innerHTML=CHECKS.map(([k,l])=>`<div class="check"><span>${l}</span><div class="yn" data-c="${k}"><button type="button" data-v="Yes" aria-pressed="false">Yes</button><button type="button" data-v="No" aria-pressed="false">No</button></div></div>`).join("");
function fill(){document.querySelectorAll("[data-k]").forEach(el=>el.value=S[el.dataset.k]??"");
  document.querySelectorAll("[data-c]").forEach(g=>g.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(S[g.dataset.c]===b.dataset.v))))}
function renderRooms(){$("rooms").innerHTML=S.rooms.map((r,i)=>`<div class="room">
  <div class="top"><label><span class="lbl">Room ${i+1}</span><input id="r${i}n" data-i="${i}" data-f="name" value="${esc(r.name)}" placeholder="e.g. Reception"></label><button class="x" type="button" data-del="${i}" aria-label="Remove room ${i+1}">×</button></div>
  <label><span class="lbl">Length (ft)</span><input id="r${i}l" data-i="${i}" data-f="len" value="${esc(r.len)}" inputmode="decimal"></label>
  <label><span class="lbl">Width (ft)</span><input id="r${i}w" data-i="${i}" data-f="wid" value="${esc(r.wid)}" inputmode="decimal"></label>
  <div class="area" id="a${i}"></div></div>`).join("");upd()}
function upd(){S.rooms.forEach((r,i)=>{const x=area(r),e=$("a"+i);if(e)e.textContent=isFinite(x)?f(x)+" sq ft":((r.len||r.wid)&&(isFinite(ft(r.len))||!r.len)&&(isFinite(ft(r.wid))||!r.wid)?"":(r.len||r.wid?"Check the length / width":""))});
  const t=totals(),est=Number(S.estimate),sub=$("sub");$("total").textContent=f(t.a);sub.className="b";
  if(t.n&&est>0){const d=t.a-est,pc=d/est*100;sub.textContent=t.n+" room"+(t.n>1?"s":"")+" · "+(d>0?"+":"")+f(d)+" vs estimate";if(Math.abs(pc)>5)sub.classList.add("off")}
  else sub.textContent=t.n?t.n+" room"+(t.n>1?"s":"")+" · "+f(t.p)+" lin ft perimeter":"Add rooms below"}

document.addEventListener("input",e=>{const el=e.target;
  if(el.dataset.k){S[el.dataset.k]=el.value;save();if(el.dataset.k==="estimate")upd()}
  else if(el.dataset.f){S.rooms[+el.dataset.i][el.dataset.f]=el.value;save();upd()}});
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  const g=b.closest("[data-c]");if(g){const k=g.dataset.c;S[k]=S[k]===b.dataset.v?"":b.dataset.v;save();fill();return}
  if(b.dataset.del!=null){if(!b.classList.contains("arm")){b.classList.add("arm");b.textContent="Sure?";setTimeout(()=>{b.classList.remove("arm");b.textContent="×"},3000);return}
    S.rooms.splice(+b.dataset.del,1);if(!S.rooms.length)S.rooms.push({name:"",len:"",wid:""});save();renderRooms()}});
$("addRoom").onclick=()=>{S.rooms.push({name:"",len:"",wid:""});save();renderRooms();$("r"+(S.rooms.length-1)+"n").focus()};
let armNew=false;$("newBtn").onclick=()=>{const b=$("newBtn");
  if(!armNew&&(S.customer||S.property)){armNew=true;b.textContent="Clear this sheet?";setTimeout(()=>{armNew=false;b.textContent="New visit"},3500);return}
  armNew=false;b.textContent="New visit";S=blank();try{localStorage.removeItem(DRAFT)}catch(e){}fill();renderRooms();$("notes").value="";window.scrollTo(0,0);toast("New visit")};
function toast(t){const el=$("toast");el.textContent=t;el.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>el.hidden=true,2600)}

function summary(){const t=totals(),est=Number(S.estimate),o=[];
  o.push("SITE MEASUREMENT – "+(S.customer||"–"),"Property: "+(S.property||"–"),"Date: "+(S.visitDate||"–")+"   Measured by: "+(S.measuredBy||"–"),"");
  o.push("SITE CHECKS");CHECKS.forEach(([k,l])=>o.push(l+": "+(S[k]||"–")));o.push("Existing floor: "+(S.existingFloor||"–"),"Subfloor: "+(S.subfloor||"–"),"");
  o.push("ROOMS");S.rooms.forEach((r,i)=>{const x=area(r);if(r.name||isFinite(x))o.push((r.name||"Room "+(i+1))+": "+(r.len||"?")+" x "+(r.wid||"?")+" = "+f(x)+" sq ft")});
  o.push("TOTAL: "+f(t.a)+" sq ft   Perimeter: "+f(t.p)+" lin ft");if(est>0)o.push("Estimate: "+f(est)+" sq ft   Difference: "+(t.a-est>0?"+":"")+f(t.a-est)+" sq ft");
  o.push("","NOTES",S.notes||"–");return o.join("\n")}
$("copyBtn").onclick=async()=>{const txt=summary();try{await navigator.clipboard.writeText(txt);toast("Summary copied")}catch(e){const ta=$("copyFallback");ta.value=txt;ta.hidden=false;ta.select()}};

// Sending (Web3Forms), with an outbox for no-signal sites
const getOut=()=>{try{return JSON.parse(localStorage.getItem(OUTBOX)||"[]")}catch(e){return[]}};
function setOut(a){try{localStorage.setItem(OUTBOX,JSON.stringify(a))}catch(e){}renderOut()}
function renderOut(){const a=getOut(),el=$("outbox");el.hidden=!a.length;if(!a.length)return;
  el.innerHTML="<b>"+a.length+" waiting to send:</b> "+a.map(x=>esc(x.label)).join(", ")+". They'll go when you have signal. <button class='btn' type='button' id='retry' style='width:100%;margin-top:8px'>Try now</button>";$("retry").onclick=flush}
async function post(p){const r=await fetch("https://api.web3forms.com/submit",{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify(p)});
  let j={};try{j=await r.json()}catch(e){}if(!r.ok||!j.success){const er=new Error(j.message||"HTTP "+r.status);er.server=true;throw er}}
let busy=false;async function flush(){if(busy)return;busy=true;let a=getOut(),n=0;for(const x of a.slice()){try{await post(x.p);a=a.filter(y=>y!==x);n++;setOut(a)}catch(e){break}}busy=false;if(n)toast(n+" waiting sheet"+(n>1?"s":"")+" sent")}
$("sendBtn").onclick=async()=>{
  if(!S.customer&&!S.property){toast("Add the customer or property first");$("customer").focus();return}
  if(ACCESS_KEY.startsWith("PASTE")){$("saveState").textContent="Sending isn't set up yet: the access key is missing from the page.";toast("Not sent");return}
  const t=totals(),p={access_key:ACCESS_KEY,subject:"Site measurement – "+(S.customer||S.property)+" – "+(S.visitDate||today()),from_name:"Site Measurement Sheet"+(S.measuredBy?" ("+S.measuredBy+")":""),
    Customer:S.customer||"",Property:S.property||"","Total area (sq ft)":f(t.a),message:summary()};
  const btn=$("sendBtn");btn.disabled=true;
  try{await post(p);$("saveState").textContent="Sent to the office at "+new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})+".";toast("Sent to the office")}
  catch(e){if(e.server){$("saveState").textContent="The email service refused it ("+e.message+"). Use Copy summary and email it.";toast("Not sent")}
    else{setOut(getOut().concat([{label:(S.customer||S.property),p}]));$("saveState").textContent="No signal. Saved on this phone; it will send when you're back online.";toast("Will send with signal")}}
  finally{btn.disabled=false}};
window.addEventListener("online",flush);

fill();renderRooms();renderOut();if(navigator.onLine!==false)flush();
})();
</script>
</body>
</html>
